<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">STELLA — Prontuário veterinário pessoal</title>
  <desc id="d">Banner bordô com patinhas decorativas, uma linha de batimento dourada e o texto STELLA: tudo sobre ela, em um só lugar.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A1024"/>
      <stop offset="0.55" stop-color="#6A1A35"/>
      <stop offset="1" stop-color="#7A1F3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#A63D5D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A63D5D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C69A3A" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#C69A3A" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#C69A3A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C69A3A" stop-opacity="0"/>
    </linearGradient>
    <g id="paw">
      <ellipse cx="0" cy="14" rx="20" ry="16"/>
      <circle cx="-25" cy="-6" r="8"/>
      <circle cx="-9" cy="-22" r="8.5"/>
      <circle cx="9" cy="-22" r="8.5"/>
      <circle cx="25" cy="-6" r="8"/>
    </g>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <!-- patinhas decorativas -->
  <g fill="#F8F5F2">
    <use href="#paw" transform="translate(96 78) rotate(-22) scale(1.7)" opacity="0.08"/>
    <use href="#paw" transform="translate(212 252) rotate(14) scale(1.05)" opacity="0.07"/>
    <use href="#paw" transform="translate(1186 244) rotate(22) scale(1.9)" opacity="0.08"/>
    <use href="#paw" transform="translate(1084 66) rotate(-12) scale(1.1)" opacity="0.07"/>
    <use href="#paw" transform="translate(330 62) rotate(8) scale(0.8)" opacity="0.06"/>
    <use href="#paw" transform="translate(960 262) rotate(-8) scale(0.85)" opacity="0.06"/>
  </g>

  <!-- batimento -->
  <path d="M40 276 H430 L452 276 L470 244 L492 304 L516 226 L540 276 H1240"
        fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- textos -->
  <text x="640" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="7" fill="#C69A3A">PRONTUÁRIO VETERINÁRIO PESSOAL</text>

  <text x="640" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="92" font-weight="700" letter-spacing="20" fill="#F8F5F2">STELLA</text>

  <text x="640" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-style="italic" fill="#F3D9DF">Tudo sobre ela, em um só lugar.</text>
</svg>
